name: CLI release

# Publishes create-nuxt-saas to npm from a `cli-v*` tag. The tag is the source of
# truth for the version: the job refuses to publish unless package.json agrees, so
# the git tag, the committed version and the version on npm can never disagree.
#
# Kit releases keep using plain `v*` tags and release.yml; the two do not overlap.

on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and pack without publishing'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance, which records that this tarball was built
      # here, from this commit.
      id-token: write
    defaults:
      run:
        working-directory: packages/create-nuxt-saas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: packages/create-nuxt-saas/package-lock.json

      - name: Install
        run: npm ci

      - name: Check the tag against package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#cli-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME wants version $TAG_VERSION but package.json says $PKG_VERSION."
            echo "Set the version first, commit it, then tag that commit:"
            echo "  npm version $TAG_VERSION --no-git-tag-version --workspace packages/create-nuxt-saas"
            exit 1
          fi
          echo "Publishing $PKG_VERSION"

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The published tarball is what users run, so check the built CLI works and
      # that the registry travelled with it.
      - name: Smoke-test the built package
        run: |
          node bin/nuxt-saas.mjs modules
          test -f registry/registry.json

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Pack only
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm pack --dry-run
