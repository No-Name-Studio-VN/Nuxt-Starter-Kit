name: CLI release

# Publishes create-nuxt-saas to npm from a `cli-v*` tag.
#
# Credentials: none. This uses npm trusted publishing (OIDC) -- GitHub mints a
# short-lived identity token for this exact workflow and npm exchanges it for
# publish rights, so there is no NPM_TOKEN to leak, rotate, or have stolen.
# npm is deprecating the alternative: from early August 2026 2FA-bypass granular
# access tokens lose account and package management, and from January 2027 they
# cannot publish at all.
# https://github.blog/changelog/2026-07-08-npm-install-time-security-and-gat-bypass2fa-deprecation/
#
# Provenance attestations are generated automatically under trusted publishing,
# so `--provenance` is neither passed nor needed.
#
# The `npm-publish` environment is the human approval step: add required
# reviewers to it in repository settings and every publish waits for a person.
#
# The tag is the source of truth for the version: the job refuses to publish
# unless package.json agrees with it, so the git tag, the committed version and
# the version on npm can never disagree.
#
# Kit releases keep using plain `v*` tags and release.yml; the two do not overlap.

on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and pack without publishing'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Gate for the human approval step. Referencing it creates it on first run;
    # protection rules are configured in repository settings.
    environment: npm-publish
    permissions:
      contents: read
      # Lets the runner mint the OIDC token npm exchanges for publish rights.
      # Without this the publish fails; it is the whole mechanism.
      id-token: write
    defaults:
      run:
        working-directory: packages/create-nuxt-saas
    steps:
      - uses: actions/checkout@v4

      # Deliberately no `registry-url`. That input exists to write
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into .npmrc, and with
      # no token set it expands to an empty value. npm then reads that as "auth is
      # already configured", never starts the OIDC exchange, and fails ENEEDAUTH.
      # registry.npmjs.org is the default registry anyway, so the input buys us
      # nothing here. setup-node has no opt-out for that line as of v4.
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14.0.
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: packages/create-nuxt-saas/package-lock.json

      # Node 26 already ships a new enough npm, but the runner image decides that,
      # not us. Upgrade only when it is too old, and stay on 11: npm 12 disables
      # install scripts and git dependencies by default, which would change how
      # `npm ci` behaves here.
      - name: Ensure npm supports trusted publishing
        run: |
          REQUIRED=11.5.1
          CURRENT="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "$REQUIRED" "$CURRENT" | sort -V | head -1)" != "$REQUIRED" ]; then
            echo "npm $CURRENT is older than $REQUIRED; installing npm@^11"
            npm install -g npm@^11
          fi
          echo "npm $(npm --version)"

      - name: Install
        run: npm ci

      - name: Check the tag against package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#cli-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME wants version $TAG_VERSION but package.json says $PKG_VERSION."
            echo "Set the version first, commit it, then tag that commit:"
            echo "  npm version $TAG_VERSION --no-git-tag-version"
            exit 1
          fi
          echo "Publishing $PKG_VERSION"

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The published tarball is what users run, so check the built CLI works and
      # that the registry travelled with it.
      - name: Smoke-test the built package
        run: |
          node bin/nuxt-saas.mjs modules
          test -f registry/registry.json

      # Belt and braces for the trap above: any leftover auth line, from a cached
      # .npmrc or a future action change, silently disables OIDC. Assert the
      # registry is what we think and that nothing claims to be authenticated.
      - name: Assert nothing is pre-authenticated
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          for npmrc in "$HOME/.npmrc" .npmrc ../../.npmrc; do
            [ -f "$npmrc" ] && sed -i '/_authToken/d' "$npmrc" && echo "stripped auth lines from $npmrc"
          done
          echo "registry: $(npm config get registry)"
          test "$(npm config get registry)" = "https://registry.npmjs.org/"

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        run: npm publish

      - name: Pack only
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm pack --dry-run
