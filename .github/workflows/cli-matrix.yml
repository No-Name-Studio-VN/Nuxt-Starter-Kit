name: CLI matrix

# Generates a project for each supported module combination and
# typechecks it. This is the only guard against undeclared coupling: a base file
# importing a module's symbol compiles fine in the kit, where every module is
# present, and fails here.

on:
  push:
    branches:
      - main
    paths:
      - 'packages/create-nuxt-saas/**'
      - '.github/workflows/cli-matrix.yml'
      - 'package.json'
      - 'nuxt.config.ts'
      - 'layers/**'
      - 'app/**'
      - 'server/**'
      - 'shared/**'
      - 'types/**'
  pull_request:
    branches:
      - main

concurrency:
  group: cli-matrix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: CLI unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # The coverage checks read the kit with `git ls-files`, so they need the
        # tree rather than an export.
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 12.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install CLI dependencies
        working-directory: packages/create-nuxt-saas
        run: pnpm --filter create-nuxt-saas install --frozen-lockfile

      - name: Test
        working-directory: packages/create-nuxt-saas
        run: pnpm test

      - name: Typecheck
        working-directory: packages/create-nuxt-saas
        run: pnpm run typecheck

  generate:
    name: ${{ matrix.name }}
    needs: unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # base alone is the load-bearing row: it is the only one that proves
          # the frontend foundation carries no server code it cannot run without.
          - name: base
            modules: ''
          - name: base + pwa
            modules: pwa
          - name: base + bot protection
            modules: bot-protection
          - name: base + content
            modules: content
          - name: base + content studio
            modules: content-studio
          - name: base + database
            modules: database
          - name: base + dashboard
            modules: dashboard
          - name: base + password sign-in
            modules: auth-password
          - name: base + oauth sign-in
            modules: auth-oauth
          - name: base + password and oauth sign-in
            modules: auth-password,auth-oauth
          - name: base + password add-ons
            modules: auth-2fa,auth-email-verification,auth-passkeys
          - name: base + oauth and passkeys
            modules: auth-oauth,auth-passkeys
          - name: base + admin users without password
            modules: admin-users,auth-oauth
          - name: base + admin kv and feature flags
            modules: admin-kv,feature-flags,auth-password
          - name: all modules
            modules: admin,admin-kv,admin-users,auth,auth-2fa,auth-email-verification,auth-oauth,auth-passkeys,auth-password,bot-protection,content,content-studio,dashboard,database,feature-flags,pwa
          - name: lifecycle (oauth, then password and its add-ons)
            modules: auth-oauth
            lifecycle: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Install CLI dependencies
        working-directory: packages/create-nuxt-saas
        run: pnpm --filter create-nuxt-saas install --frozen-lockfile

      - name: Build the CLI
        working-directory: packages/create-nuxt-saas
        run: pnpm run build

      - name: Generate the project
        run: |
          node packages/create-nuxt-saas/bin/nuxt-saas.mjs init \
            "$RUNNER_TEMP/generated" \
            --yes \
            --kit . \
            --no-git \
            --modules '${{ matrix.modules }}'

      # husky's install step expects a repository, and pnpm runs it during install.
      - name: Initialise a repository
        working-directory: ${{ runner.temp }}/generated
        run: git init --quiet

      - name: Add and remove modules on an existing project
        if: matrix.lifecycle == true
        working-directory: ${{ runner.temp }}/generated
        run: |
          CLI="$GITHUB_WORKSPACE/packages/create-nuxt-saas/bin/nuxt-saas.mjs"
          commit() {
            git add -A
            git -c user.name=ci -c user.email=ci@local commit -qm "$1"
          }
          # auth without a sign-in method is refused and writes nothing.
          if node "$CLI" init "$RUNNER_TEMP/refused" --yes --kit "$GITHUB_WORKSPACE" --no-git --modules auth; then exit 1; fi
          test ! -e "$RUNNER_TEMP/refused"
          commit init
          node "$CLI" add auth-password --kit "$GITHUB_WORKSPACE"
          commit "add password"
          node "$CLI" add auth-2fa --kit "$GITHUB_WORKSPACE"
          commit "add 2fa"
          # 2FA still needs password, so removing password alone is refused.
          if node "$CLI" remove auth-password --kit "$GITHUB_WORKSPACE"; then exit 1; fi
          node "$CLI" remove auth-2fa,auth-password --kit "$GITHUB_WORKSPACE"
          commit "remove password"
          test ! -d layers/auth-password
          test ! -d layers/email

      - name: Check for module leaks
        working-directory: ${{ runner.temp }}/generated
        run: |
          ! grep -rIl 'n[s]k' . --exclude-dir=node_modules || exit 1
          SELECTED="$(node -p "require('./.nuxt-saas.json').modules.join(' ')")"
          for MODULE in "$GITHUB_WORKSPACE"/layers/*/module.json; do
            ID="$(basename "$(dirname "$MODULE")")"
            case " $SELECTED " in
              *" $ID "*) ;;
              *) test ! -d "layers/$ID" ;;
            esac
          done

      - name: Install the generated project
        working-directory: ${{ runner.temp }}/generated
        run: |
          cp .env.example .env
          pnpm install --no-frozen-lockfile

      - name: Typecheck the generated project
        working-directory: ${{ runner.temp }}/generated
        run: pnpm run typecheck

      - name: Generate database migrations when selected
        working-directory: ${{ runner.temp }}/generated
        run: |
          if [ "$(node -p "require('./.nuxt-saas.json').modules.includes('database')")" = true ]; then
            pnpm db:generate
            if [ -n "$(find layers -path 'layers/*/server/db/schema*.ts' -type f -print -quit)" ]; then
              test -n "$(ls server/db/migrations/sqlite/*.sql)"
            fi
          fi
