packages:
  - packages/*

# NuxtHub's schema generator still requires the TypeScript compiler API.
overrides:
  typescript: npm:@typescript/typescript6@^6.0.2

# NuxtHub generates @nuxthub/kv outside pnpm's dependency tree; its types import unstorage.
publicHoistPattern:
  - unstorage

allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  better-sqlite3: true
  esbuild: true
  fsevents: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
  workerd: true

minimumReleaseAgeExclude:
  - '@lucide/vue@1.60.0'
  - '@nuxthub/core@0.10.10'
  - eslint-plugin-better-tailwindcss@4.10.0
  - happy-dom@21.0.4
  - miniflare@5.20261019.1-beta
  - wrangler@4.151.3
